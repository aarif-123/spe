<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Voice Notes</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(ellipse at 12% 5%, rgba(119, 142, 255, .13), transparent 35%),
        radial-gradient(ellipse at 90% 92%, rgba(56, 189, 169, .10), transparent 30%),
        #f5f7fb;
    }

    button, select { font: inherit; }

    .app {
      width: min(100%, 760px);
      overflow: hidden;
      border: 1px solid #e8ebf2;
      border-radius: 22px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 24px 70px rgba(34, 47, 85, .10);
    }

    .top {
      padding: 30px 34px 26px;
      border-bottom: 1px solid #edf0f5;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #69758e;
      font-size: .73rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.25rem);
      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #788399;
      font-size: .96rem;
      line-height: 1.55;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 34px;
      background: #fbfcfe;
      border-bottom: 1px solid #edf0f5;
    }

    .button {
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .button:hover:not(:disabled) { transform: translateY(-1px); }
    .button:focus-visible, select:focus-visible { outline: 3px solid #aebcff; outline-offset: 2px; }
    .button:disabled { cursor: not-allowed; opacity: .48; }

    .primary {
      color: white;
      background: #5368e8;
      box-shadow: 0 5px 13px rgba(83, 104, 232, .22);
    }

    .primary:hover:not(:disabled) { background: #4358d8; }
    .secondary { color: #34405b; background: white; border-color: #e1e6ef; }
    .secondary:hover:not(:disabled) { background: #f4f6fa; }
    .quiet { margin-left: auto; color: #788399; background: transparent; }
    .quiet:hover:not(:disabled) { color: #34405b; background: #f0f2f7; }

    .select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: #79849a;
      font-size: .82rem;
      font-weight: 650;
    }

    select {
      max-width: 150px;
      padding: 8px 26px 8px 10px;
      border: 1px solid #e1e6ef;
      border-radius: 9px;
      color: #34405b;
      background: white;
      cursor: pointer;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 34px 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #768198;
      font-size: .82rem;
      font-weight: 650;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #aeb6c5;
    }

    .status[data-state="listening"] { color: #16856f; }
    .status[data-state="listening"] .status-dot {
      background: #25b491;
      box-shadow: 0 0 0 4px rgba(37, 180, 145, .13);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .status[data-state="paused"] .status-dot { background: #edac48; }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 7px rgba(37, 180, 145, .04); }
    }

    .word-count { color: #9aa3b3; font-size: .78rem; }

    .transcript-wrap { padding: 14px 34px 28px; }

    .transcript {
      min-height: 285px;
      max-height: 52vh;
      overflow: auto;
      padding: 22px 24px;
      border: 1px solid #edf0f5;
      border-radius: 14px;
      color: #35415a;
      background: #fff;
      font-size: 1rem;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .placeholder { color: #a0a9b8; }
    .interim { color: #8b95a8; font-style: italic; }
    .notice {
      min-height: 22px;
      margin: 11px 2px 0;
      color: #a15a38;
      font-size: .82rem;
      line-height: 1.5;
    }

    .footer {
      padding: 0 34px 22px;
      color: #9aa3b3;
      font-size: .76rem;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      body { padding: 16px 10px; }
      .app { border-radius: 17px; }
      .top { padding: 25px 22px 21px; }
      .controls { flex-wrap: wrap; padding: 16px 22px; gap: 9px; }
      .button { min-height: 42px; padding: 0 13px; }
      .select-wrap { order: 1; width: 100%; margin: 3px 0 0; }
      select { flex: 1; max-width: none; }
      .quiet { margin-left: auto; }
      .status-row { padding: 15px 22px 0; }
      .transcript-wrap { padding: 12px 22px 24px; }
      .transcript { min-height: 260px; padding: 18px; }
      .footer { padding: 0 22px 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="eyebrow">Voice notes</p>
      <h1>Turn your voice into text</h1>
      <p class="subtitle">Press record and speak naturally. Your words appear here as you talk.</p>
    </header>

    <section class="controls" aria-label="Recording controls">
      <button class="button primary" id="startButton" type="button">Start listening</button>
      <button class="button secondary" id="pauseButton" type="button" disabled>Pause</button>
      <label class="select-wrap" for="languageSelect">
        Language
        <select id="languageSelect" aria-label="Recognition language">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
          <option value="hi-IN">हिन्दी</option>
        </select>
      </label>
      <button class="button quiet" id="clearButton" type="button">Clear</button>
    </section>

    <div class="status-row">
      <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Ready when you are</span>
      </div>
      <span class="word-count" id="wordCount">0 words</span>
    </div>

    <section class="transcript-wrap" aria-label="Transcript">
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text"><span class="placeholder">Your transcript will show up here...</span></div>
      <p class="notice" id="notice" role="alert"></p>
    </section>
    <footer class="footer">A short pause in speech starts a new line. Pausing the microphone also saves your current line.</footer>
  </main>

  <script>
    (() => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const startButton = document.getElementById("startButton");
      const pauseButton = document.getElementById("pauseButton");
      const clearButton = document.getElementById("clearButton");
      const languageSelect = document.getElementById("languageSelect");
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const transcript = document.getElementById("transcript");
      const wordCount = document.getElementById("wordCount");
      const notice = document.getElementById("notice");
      const pauseAfterSpeech = 1400;

      let recognition;
      let shouldListen = false;
      let isListening = false;
      let retryDelay = 1000;
      let lines = [];
      let currentLine = "";
      let interimText = "";
      let pauseTimer;
      let retryTimer;

      function updateTranscript() {
        transcript.replaceChildren();
        const content = [...lines, currentLine].filter(Boolean).join("\n");
        const totalText = [content, interimText].filter(Boolean).join(content && interimText ? " " : "");

        if (!totalText) {
          const placeholder = document.createElement("span");
          placeholder.className = "placeholder";
          placeholder.textContent = "Your transcript will show up here...";
          transcript.append(placeholder);
        } else {
          transcript.textContent = content;
          if (interimText) {
            if (content) transcript.append(document.createTextNode(" "));
            const interim = document.createElement("span");
            interim.className = "interim";
            interim.textContent = interimText;
            transcript.append(interim);
          }
        }

        const words = totalText.trim().match(/\S+/g);
        const count = words ? words.length : 0;
        wordCount.textContent = `${count} ${count === 1 ? "word" : "words"}`;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function setStatus(state, message) {
        status.dataset.state = state;
        statusText.textContent = message;
      }

      function finishLine() {
        clearTimeout(pauseTimer);
        if (currentLine.trim()) lines.push(currentLine.trim());
        currentLine = "";
        interimText = "";
        updateTranscript();
      }

      function scheduleLineBreak() {
        clearTimeout(pauseTimer);
        pauseTimer = setTimeout(() => {
          if (currentLine.trim()) {
            lines.push(currentLine.trim());
            currentLine = "";
            updateTranscript();
          }
        }, pauseAfterSpeech);
      }

      function startRecognition() {
        if (!recognition || isListening || retryTimer) return;
        notice.textContent = "";
        shouldListen = true;
        setStatus("listening", "Starting microphone...");
        try {
          recognition.lang = languageSelect.value;
          recognition.start();
        } catch (error) {
          shouldListen = false;
          notice.textContent = "The microphone could not be started. Check browser microphone permission and try again.";
          setStatus("idle", "Ready when you are");
        }
      }

      function stopListening(message) {
        shouldListen = false;
        clearTimeout(retryTimer);
        retryTimer = undefined;
        clearTimeout(pauseTimer);
        finishLine();
        setStatus("idle", message);
        startButton.disabled = false;
        startButton.textContent = "Start listening";
        pauseButton.disabled = true;
      }

      function scheduleRetry() {
        if (!shouldListen || retryTimer) return;
        const delay = retryDelay;
        retryDelay = Math.min(retryDelay * 2, 8000);
        retryTimer = setTimeout(() => {
          retryTimer = undefined;
          if (!shouldListen) return;
          try {
            recognition.start();
          } catch (error) {
            scheduleRetry();
          }
        }, delay);
      }

      if (!SpeechRecognition) {
        startButton.disabled = true;
        pauseButton.disabled = true;
        setStatus("idle", "Speech recognition unavailable");
        notice.textContent = "Your browser does not support speech recognition. Try Chrome or Edge, and allow microphone access.";
      } else {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = languageSelect.value;

        recognition.onstart = () => {
          clearTimeout(retryTimer);
          retryTimer = undefined;
          retryDelay = 1000;
          isListening = true;
          shouldListen = true;
          startButton.textContent = "Listening...";
          startButton.disabled = true;
          pauseButton.disabled = false;
          notice.textContent = "";
          setStatus("listening", "Listening to your voice");
        };

        recognition.onresult = (event) => {
          interimText = "";
          for (let i = event.resultIndex; i < event.results.length; i += 1) {
            const text = event.results[i][0].transcript.trim();
            if (event.results[i].isFinal && text) {
              currentLine = `${currentLine}${currentLine ? " " : ""}${text}`;
            } else if (text) {
              interimText = `${interimText}${interimText ? " " : ""}${text}`;
            }
          }
          updateTranscript();
          if (currentLine || interimText) scheduleLineBreak();
        };

        recognition.onerror = (event) => {
          if (event.error === "no-speech") return;
          isListening = false;
          const messages = {
            "not-allowed": "Microphone access was blocked. Allow microphone access in your browser settings to transcribe.",
            "service-not-allowed": "Speech recognition is not available for this page.",
            "audio-capture": "No microphone was found. Connect a microphone and try again.",
            network: "Speech recognition needs an internet connection. Reconnecting..."
          };
          if (event.error === "not-allowed" || event.error === "service-not-allowed" || event.error === "audio-capture") {
            notice.textContent = messages[event.error];
            stopListening("Not listening");
            return;
          }
          notice.textContent = messages[event.error] || `Speech recognition interrupted (${event.error}). Reconnecting...`;
          if (shouldListen) setStatus("listening", "Reconnecting to speech service...");
        };

        recognition.onend = () => {
          isListening = false;
          if (shouldListen) {
            startButton.disabled = true;
            pauseButton.disabled = false;
            setStatus("listening", "Reconnecting to speech service...");
            scheduleRetry();
          } else {
            finishLine();
            startButton.disabled = false;
            startButton.textContent = status.dataset.state === "paused" ? "Resume listening" : "Start listening";
            pauseButton.disabled = true;
          }
        };
      }

      startButton.addEventListener("click", () => {
        if (!isListening) startRecognition();
      });

      pauseButton.addEventListener("click", () => {
        if (!recognition || !shouldListen) return;
        shouldListen = false;
        clearTimeout(retryTimer);
        retryTimer = undefined;
        clearTimeout(pauseTimer);
        setStatus("paused", "Paused");
        if (isListening) {
          recognition.stop();
        } else {
          finishLine();
          startButton.disabled = false;
          startButton.textContent = "Resume listening";
          pauseButton.disabled = true;
        }
      });

      clearButton.addEventListener("click", () => {
        if (recognition && shouldListen) {
          shouldListen = false;
          clearTimeout(retryTimer);
          retryTimer = undefined;
          if (isListening) recognition.stop();
          else {
            startButton.disabled = false;
            startButton.textContent = "Start listening";
            pauseButton.disabled = true;
            setStatus("idle", "Ready when you are");
          }
        }
        clearTimeout(pauseTimer);
        lines = [];
        currentLine = "";
        interimText = "";
        updateTranscript();
        notice.textContent = "";
        if (!isListening) setStatus("idle", "Ready when you are");
      });
    })();
  </script>
</body>
</html>
